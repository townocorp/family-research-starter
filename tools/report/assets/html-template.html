<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
body { max-width: 52rem; margin: 3rem auto; padding: 0 1.5rem; color: #202733; background: #fff; font: 1.05rem/1.65 system-ui, sans-serif; }
h1, h2, h3 { line-height: 1.25; break-after: avoid; }
h1 { margin-top: 2.5rem; }
header { border-bottom: 2px solid #44566e; padding-bottom: 1.5rem; }
.notice { padding: 1rem; border-left: .25rem solid #44566e; background: #f2f4f7; }
a { color: #174d82; text-decoration-thickness: .1rem; }
a:focus { outline: 2px solid #174d82; outline-offset: 3px; }
figure { margin: 2rem 0; break-inside: avoid; text-align: center; }
img { max-width: 100%; height: auto; }
.caption { font-style: italic; margin: .5rem 0; }
.source, cite { font-size: .9rem; }
blockquote { margin: 1.5rem; border-left: 3px solid #667; padding-left: 1rem; }
.references { list-style: none; padding-left: 0; }
.references li { margin: 1rem 0; overflow-wrap: anywhere; }
@media print {
  body { max-width: none; margin: 0; padding: 0; font-size: 11pt; }
  .back { display: none; }
  a { color: inherit; }
}
</style>
</head>
<body>{{BODY}}</body>
</html>
